<script id="carousel-data" type="application/json">{"team": "FBA-PST2", "sprint": "Sprint6", "snapshot": "2026-11-26 19:37 北京时间", "start": "2026-11-16", "end": "2026-11-27", "stories": [["8590", "动态安全天数推荐试算输出", "罗佳润、庞焕坤", 16, false, "ZN00-F03-S05 | 动态安全天数推荐试算输出：作为库存计划员，我希望系统能按放行的方案 v1 对每个对象试算推荐安全天数、触发提前量（相对当前触发日的提前/延后天数）和人话版调整原因，以便在数据共识评审时用真实试算结果判断方案是否值得定稿、哪些对象应更早或延后触发。"], ["8604", "动态安全天数数据共识", "罗佳润、庞焕坤", 8, false, "ZN00-F03-S06 | 动态安全天数数据共识：作为库存管理负责人，我希望基于真实数据（固定安全天数基线 + 动态方案试算明细）与业务方完成数据共识评审，把模型、上下界阈值、灰度参数真正拍板并形成方案定稿，以便后续圈定测试集与灰度上线有经数据验证的对齐基准。"], ["15128", "决策模型：训练模型", "赖程、汤翊", 40, false, "Sprint5:-S0008 | 决策模型 | 训练模型\n\n基于前期准备的数据和方案，先训练一个只判断“修改理由是否合理”的基线模型作为对照，再训练校准表现更优的候选模型。训练需同时优化判断正确性和置信度校准——模型说“合理”且置信度高时，实际合理的比例应与之匹配，避免过度自信。最终产出完整的模型报告供评估和发布评审使用。"], ["15130", "决策模型：模型评估与上线标准", "赖程、庞焕坤", 8, false, "Sprint5:-S0008 | 决策模型 | 模型评估与上线标准\n\n用独立测试集确认候选模型达到上线门槛，评估不仅看判断准确率，还看置信度是否可信，确保上线后低置信判断能正确转人工复核。"], ["17695", "本地仓模型调整：15单以上改为10单以上", "赖程、雷洋", 32, false, "Sprint6-S004 ｜ 本地仓模型调整（15 单以上调整为 10 单以上）\n\n作为算法工程师，我希望在已就绪的数据集（F1-02 交付）上完成新本地仓建单预测模型的特征加工、训练与效果迭代，以便按定稿的评估标准（F1-01 交付）验证模型水准达到可上线基线，产出可用于备货决策的预测结果。"], ["17688", "仿真沙盘：备货逻辑全量覆盖", "易梓盛、庞焕坤", 80, false, "Sprint6-S008 ｜ 仿真沙盘的备货逻辑全量覆盖。\n（从当前仅覆盖 3（常态化备货） 扩展到 全量）\n作为备货策略负责人，我希望在仿真沙盘中基于同一业务场景运行当前全部生效的备货逻辑，并获得可比较的备货建议及库存风险结果，以便在正式备货前发现仅覆盖常态化备货时看不到的断货、周转和呆滞风险。"], ["17692", "MCP增加全链路时效", "庞焕坤、雷洋", 8, true, "MCP增加全链路时效\n\n作为库存管理负责人，我希望 MCP 新增全链路时效相关取值逻辑，实现根据自然语言提问输出相关指标数据，降低取数难度，提高取数效率。"], ["17685", "库存Agent分析指标增加全链路时效", "雷洋、庞焕坤", 16, true, "库存Agent分析指标增加全链路时效\n\n作为库存管理负责人，我希望 Agent 能根据自然语言提问，实现全链路时效相关取值口径、取数、输出对应数据、分析和报告生成。"], ["17687", "库存Agent优化", "雷洋、庞焕坤", 16, true, "库存Agent优化\n\n优化当前agent结果生成的细节和运行性能"], ["17689", "春节备货逻辑确认", "雷洋", 16, false, "春节备货逻辑确认\n\n作为备货运营负责人，我希望在春节前按提前推送计划，以便不受春节期间工厂停工、物流中断、工作日推送暂停影响，减少节后断货"], ["17690", "节日逾期未发货订单跟进分析及时间提醒", "汤翊", 16, true, "Sprint6： 节日逾期未发货订单跟进分析+时间提醒\n\n作为节日订单跟进负责人（徐夏怡），我希望查看节日未发货订单及提醒后的跟进情况，并定期收到各站点、各运输方式临近发货风险节点的钉钉提醒，以便及时通知高级主管安排销售跟进，减少节日订单因延迟发货而错过销售窗口的风险。"], ["17686", "美客多南美市场备货方案确认", "汤翊", 24, true, "Sprint6-S007 ｜ 美客多南美市场备货方案确认\n作为南美市场负责人，我希望确认美客多（Mercado Libre）南美市场的备货方案，以便美客多渠道的备货有明确可执行的策略，而不是沿用不匹配的 FBA 逻辑或无策略可依。"], ["17699", "百货销量预测线上效果评估及BI搭建", "罗佳润、庞焕坤", 24, true, "Sprint6-S006 ｜ 百货销量预测线上效果评估及 BI 搭建\n\n作为备货策略负责人，我希望评估百货类目销量预测模型的线上效果，并搭建相应的 BI 看板，以便用线上真实数据判断百货预测是否准确、并为后续模型迭代提供持续观测手段。"], ["17700", "动态安全天数销量口径与p值区间测算", "罗佳润、庞焕坤", 16, false, "动态安全天数销量口径与p值区间测算（ZN00-F03-S10）\n\n作为销售人员，我希望对「到货后销量口径」与「健康可售天数评价区间」两个共识待拍板项完成历史数据测算，以便在共识会上用数据依据而非暂定值拍板销量口径基准与 p 值选择主判据。"], ["17696", "库存测算表改造并固化为自定义报告", "未填", 16, false, "Sprint6-S005-1 ｜ 库存测算表改造并固化为自定义报告\n\n作为 GST 团队管理者，我希望对库存测算表（世鹏脚本）进行改造，数据范围改成GST1-3，并在验证数据无异常后固化为自定义报告，以便 SOP 团队能稳定、低成本地查看库存测算结果，而不是依赖临时脚本或人工跑数。"], ["17983", "决策模型融入备货功能", "赖程、易梓盛", 24, false, "决策模型融入备货功能"], ["18239", "健康库存定义口径与BI监控", "罗佳润", 8, false, "健康库存定义口径与 BI 监控（ZN00-F02-S09）\n\n作为库存管理负责人，我希望定义\"健康库存\"的判定口径（一把统一的尺子，明确哪些库存算健康、哪些属于断货风险或积压呆滞风险），并在 BI 看板上持续监控健康库存率的趋势与不健康库存的构成，以便用统一标准评估整体库存经营质量、及时发现不健康库存集中在哪些对象上，并推动针对性改善与月度复盘。"], ["17684", "新品备货逻辑优化：推荐备货量偏高", "雷洋", 24, false, "Sprint6-S001 ｜ 新品备货逻辑的优化（新品推荐备货量偏高）\n\n作为备货策略负责人，我希望先分析新品推荐备货量偏高的原因、给出新品备货逻辑的调整方案，并在方案评审确认后完成新逻辑的上线，以便新品推荐备货量回归合理水平，减少新品过度备货，同时让调整后的备货逻辑真正落地到日常推送链路。"]], "okr": [["O1：提升智能备货系统的自主能力和决策质量", ["KR1：5单以下集中备货12月31日前全面承接", "KR2：15单以下在仓周转天数同比改善10%", "KR3：10单以上10天发货率大于等于80%"]], ["O2：提升库存管理质量", ["KR1：呆滞率降低至30%", "KR2：在仓+在途周转天数降低至125天", "KR3：5+异常断货率不高于7.5%"]], ["O3：提升价值流迭代的交付质量", ["KR1：生产环境缺陷数量不超过5个", "KR2：用户故事一次性验收通过率大于95%"]], ["O4：缩短价值流需求的交付周期", ["KR1：Feature需求交付周期缩短10%以上", "KR2：Story需求交付周期缩短20%以上"]], ["O5：降低店铺运营操作风险", ["KR1：重大事故次数0次\n（基于重大事故的定义）", "KR2：损失不超10W\n（listing数量不超过60W、作业工时不超过1000人时）", "KR3：事故发现时效不超过24小时", "KR4：回退处理时效不超过48小时"]]], "goals": ["上线月销 0–5 单的 Asin 备货接管功能，模型决策同步上线或准备上线", "实现仿真沙盘的全逻辑覆盖", "销量预测的效果验证和BI监控", "优化库存Agent和指标MCP", "健康库存定义口径和BI监控", "本地仓销量预测模型增大覆盖Asin量"]}</script><script>
'use strict';let data=JSON.parse(document.getElementById('carousel-data').textContent);const durations=[300,300,30,30],names=['OKR','Sprint 概览','交付','预测'];let index=0,deadline=Date.now()+300000,refreshAt=Date.now()+1800000,transition=0,frame=null,timeout=null;const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const pct=(a,b)=>b?100*a/b:null;function state(p){return p>85?'正常':p>=75?'有风险':'无法达成'}function metrics(){const s=data.stories;const done=s.filter(x=>x[4]);return {count:s.length,done:done.length,points:s.reduce((a,x)=>a+x[3],0),donePoints:done.reduce((a,x)=>a+x[3],0),elapsed:9,remaining:1}}function burn(){const actual=[392,392,392,376,376,376,376,376,376,288];let graph='<svg viewBox="0 0 660 310" aria-label="Sprint6 燃尽图，实际曲线按看板图形读数；总点392，完成104，剩余288">';for(let y=0;y<=400;y+=100)graph+=`<line x1="55" x2="620" y1="${265-y*.55}" y2="${265-y*.55}" stroke="#35505d"/><text x="10" y="${270-y*.55}" fill="#a8bbc6" font-size="14">${y}</text>`;let points=actual.map((v,i)=>`${55+i*56.5},${265-v*.55}`).join(' ');graph+=`<polyline points="${points}" fill="none" stroke="#66ead3" stroke-width="3"/><line x1="55" y1="49.4" x2="620" y2="265" stroke="#ffc47a" stroke-width="2"/><line x1="563.5" y1="106.6" x2="620" y2="112.956" stroke="#d2b9ff" stroke-width="3" stroke-dasharray="6 5"/>`;const ds=['基线','16','17','18','19','20','23','24','25','26','27'];ds.forEach((d,i)=>graph+=`<text x="${55+i*56.5}" y="291" fill="#a8bbc6" text-anchor="middle" font-size="13">${d==='基线'?d:'11/'+d}</text>`);return graph+'</svg><div class="hint">青绿：实际（图形读数） · 金色：参考 · 紫色虚线：预测<br>图形点位含近似读数；精确总点与完成点取自看板统计。最后实际点为11/26。</div>'}
function render(){const m=metrics(),pred=Math.min(m.count,m.done+m.done/m.elapsed*m.remaining),p=pct(pred,m.count),pointPred=Math.min(m.points,m.donePoints+m.donePoints/m.elapsed*m.remaining);document.getElementById('pages').innerHTML=`<section class="page"><h1>OKR · 用结果衡量价值</h1><div class="hint">Sheet：PST2 · 期间未核实 · 快照：${esc(data.snapshot)} · 全部 KR 达成值未填、阈值差距无法计算 · 截止预测：数据不足，无法预估</div><div class="grid okr">${data.okr.map(o=>`<article class="card"><h2>${esc(o[0])}</h2>${o[1].map(k=>`<p>${esc(k)} <em>｜未填 · 差距未知</em></p>`).join('')}</article>`).join('')}</div></section><section class="page"><h1>Sprint6 · 还剩 1 个完整工作日</h1><div class="status">${state(p)}（预估完成 ${p.toFixed(1)}%）</div><div class="grid split"><article class="card"><h2>完整迭代目标</h2><ol class="goals">${data.goals.map(g=>`<li>${esc(g)}</li>`).join('')}</ol><div class="hint">承诺量未核实 · 当前范围18个故事/392点<br>工作日配置：周一至周五；今天之后至11/27剩余1天。<br>容量说明与故事梳理链接已排除出目标。</div></article><article class="card"><div class="metricrow"><div class="metric"><small>用户故事完成</small><strong>${m.done}/${m.count}</strong><small>${pct(m.done,m.count).toFixed(1)}%</small><div class="bar"><i style="width:${pct(m.done,m.count)}%"></i></div></div><div class="metric"><small>故事点完成</small><strong>${m.donePoints}/${m.points}</strong><small>${pct(m.donePoints,m.points).toFixed(1)}% · 剩余288点</small><div class="bar"><i style="width:${pct(m.donePoints,m.points)}%"></i></div></div></div>${burn()}<div class="hint">看板总卡片19张含“涌现任务”1张，故事率排除该任务。<br>快照：${esc(data.snapshot)}；参考线采用当前总点，承诺基线未核实。</div></article></div></section><section class="page"><h1>交付 · 6 已完成 / 12 未开始 / 0 进行中 / 0 测试中</h1><div class="hint">按用户故事类型与当前状态列统计。任务子项完成不等于故事验收完成；悬停查看完整原文。</div><div class="grid deliver">${[...data.stories.filter(s=>s[4]),...data.stories.filter(s=>!s[4])].map(s=>`<article class="card ${s[4]?'done':'pending'}" title="${esc(s[5]||s[1])}"><h2>${esc(s[1])}</h2><small>#${s[0]} · ${s[4]?'已完成':'未开始'} · ${s[3]}点 · ${esc(s[2])}</small></article>`).join('')}</div></section><section class="page"><h1>预测 · 聚焦验收与依赖</h1><div class="status">${state(p)}（预估完成 ${p.toFixed(1)}%）</div><div class="grid split"><article class="card risk"><h2>预测（速度与范围不变）</h2><div class="metricrow"><div class="metric"><small>剩余故事</small><strong>12</strong><small>0.67故事/工作日</small></div><div class="metric"><small>截止预计</small><strong>${pred.toFixed(2)}</strong><small>/18故事 · ${p.toFixed(1)}%</small></div></div><p>已纳入9个工作日，剩余1个完整工作日。故事点速度11.56点/工作日；截止预计${pointPred.toFixed(1)}/392点（${pct(pointPred,m.points).toFixed(1)}%）。</p><p><b>范围说明</b>：当前18个用户故事；历史承诺量未核实。按当前范围预测，不能用于判断承诺履约。</p><p><b>质量信息缺失</b>：本次尚未重新核对线上缺陷管理看板；历史团队标签归属未核实，无法确认本队高优先级缺陷数量。</p><div class="hint">事实与预测分开：这些预测由累计完成量外推，并非已确认交付承诺。OKR因达成值未填、期间与跨日历史不足，无法预估整体率。</div></article><article class="card risk"><h2>事实、依赖与建议</h2><p><b>依赖</b>：#8604数据共识需要基线与#8590试算材料，四类参数拍板后产出v2，才能圈定测试集并灰度。罗佳润、庞焕坤。</p><p><b>事实</b>：#17688仿真沙盘仍在未开始列，80点；批量数据验证任务#19294进行中。易梓盛、庞焕坤。</p><p><b>事实</b>：#18072“拉初版数据出来，跟业务确认”仍进行中，截止11/25 18:00，已逾期。雷洋。</p><p><b>事实</b>：#17696报告改造及#18730核对数据尚未完成，负责人未填；#18239健康库存口径与BI监控尚未开始，罗佳润。</p><p><b>事实</b>：#17983模型融入备货仍未开始；#19295对接代码进行中、#19297测试待办。易梓盛、赖程。</p><p><b>建议</b>：优先确认模型与沙盘的验收材料、推进数据共识；将仍未完成的故事逐项确认截止安排，补齐未填负责人。建议尚未指派。</p></article></div></section>`;show(false)}
function show(animate=true){document.querySelectorAll('.page').forEach((p,i)=>{p.className='page'+(i===index?' active'+(animate?' t'+transition%6:''):'')});document.getElementById('position').textContent=`${index+1}/4 · ${names[index]} · 每轮11分钟`;if(animate)transition++}function move(n){index=(index+n+4)%4;deadline=Date.now()+durations[index]*1000;show()}const fmt=n=>`${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`;function tick(){const now=Date.now();if(now>=deadline)move(1);const left=Math.max(0,Math.ceil((deadline-now)/1000));document.getElementById('countdown').textContent=fmt(left);document.getElementById('progress').style.width=100*(1-left/durations[index])+'%';document.getElementById('clock').textContent=new Date().toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',hour12:false});if(now>=refreshAt&&!frame)reloadData();document.getElementById('refresh').textContent='文件重读 '+fmt(Math.max(0,Math.ceil((refreshAt-now)/1000)))}function finish(ok){clearTimeout(timeout);frame?.remove();frame=null;refreshAt=Date.now()+(ok?1800000:60000);document.getElementById('refresh').title=ok?'上次重读成功（含文件未变）':'重读失败，保留画面，1分钟后重试'}function reloadData(){frame=document.createElement('iframe');frame.hidden=true;const url=new URL(location.href);url.search='?carouselRefresh=1&v='+Date.now();frame.src=url.href;document.body.append(frame);timeout=setTimeout(()=>finish(false),10000)}window.addEventListener('message',e=>{if(!frame||e.source!==frame.contentWindow)return;const d=e.data;if(d?.kind!=='carousel-data'||d.payload?.team!==data.team||!Array.isArray(d.payload.stories)||d.payload.okr?.length!==5)return finish(false);data=d.payload;render();finish(true)});document.getElementById('prev').onclick=()=>move(-1);document.getElementById('next').onclick=()=>move(1);document.getElementById('full').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')move(1);if(e.key==='ArrowLeft')move(-1)});render();if(new URLSearchParams(location.search).has('carouselRefresh'))parent.postMessage({kind:'carousel-data',payload:data},'*');else{tick();setInterval(tick,250)}
